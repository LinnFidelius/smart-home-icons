name: Release

# Legt automatisch ein GitHub-Release an, sobald sich die Datei VERSION ändert.
on:
  push:
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release anlegen (falls neu)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION existiert bereits"
          else
            gh release create "v$VERSION" smart-home-icons.js --title "$VERSION" --notes "$(git log -1 --pretty=%s)"
          fi
